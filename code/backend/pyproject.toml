[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "serious-game-backend"
version = "0.1.0"
description = "Authoritative backend runtime for 浊流之上"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.131.0",
    "pydantic==2.12.5",
    "uvicorn==0.41.0",
    "PyMySQL==1.2.0",
    "cryptography==45.0.7",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
